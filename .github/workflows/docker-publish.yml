name: Push and build Docker images

on:
  push:
    branches: [main]
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
     - name: Checkout Code
       uses: actions/checkout@v4

     - name: Login Docker hub
       uses: docker/login-action@v3
       with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_PASSWORD}}

     - name: Build and push app images
       uses: docker/build-push-action@v5
       with:
          context: ./app
          push: true
          tags: ${{secrets.DOCKERHUB_USERNAME}}/aqi-tracker-app:latest

     - name: Build and push fetcher images
       uses: docker/build-push-action@v5
       with:
          context: ./fetcher
          push: true
          tags: ${{secrets.DOCKERHUB_USERNAME}}/aqi-tracker-fetcher:latest
     - name: EC2 deploy
       uses: appleboy/ssh-action@v1
       with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USER}}
          key: ${{secrets.EC2_SSH_KEY}}
          script: |
            cd ~ aqi-tracker
            docker compose -f Docker-compose.yml pull
            docker compose -f Docker-compose.yml up -d
