events {}
http {
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=alerts:10m rate=2r/s;
    server_tokens off;
    client_max_body_size 1m;

    server {
        listen 80;
        server_name myaqi.xyz www.myaqi.xyz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://myaqi.xyz$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name myaqi.xyz www.myaqi.xyz;

        ssl_certificate /etc/letsencrypt/live/myaqi.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/myaqi.xyz/privkey.pem;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /alerts {
            limit_req zone=alerts burst=5 nodelay;
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}