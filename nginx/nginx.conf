events
{

}
http {
    server{
        listen 80;
        server_name myaqi.xyz www.myaqi.xyz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://myaqi.xyz$request_uri;
        }
    }
    server{
        listen 443
        server_name myaqi.xyz;

        ssl_certificate /etc/nginx/ssl/live/myaqi.xyz/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/myaqi.xyz/privkey.pem;

        location /
        {
            proxy_pass http://myaqi.xyz;
        }
    }
}